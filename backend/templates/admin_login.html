<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Admin Login — MOOC Platform</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b0e14;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #e6e9f0;
    }
    .card {
      width: 100%;
      max-width: 380px;
      background: #161a24;
      border: 1px solid #262c3a;
      border-radius: 14px;
      padding: 2rem;
      box-shadow: 0 10px 30px -12px rgba(0,0,0,0.55);
    }
    h1 { font-size: 1.3rem; margin: 0 0 1.25rem; text-align: center; }
    label { display: block; font-size: 0.8rem; color: #8b93a7; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 0.35rem; }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 0.55rem 0.75rem;
      margin-bottom: 1rem;
      background: #11141d;
      border: 1px solid #262c3a;
      border-radius: 8px;
      color: #e6e9f0;
      font-size: 0.95rem;
    }
    input:focus { outline: none; border-color: #6366f1; }
    button {
      width: 100%;
      padding: 0.65rem;
      border: none;
      border-radius: 8px;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: white;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
    }
    .error {
      background: rgba(244,63,94,0.14);
      color: #f43f5e;
      padding: 0.6rem 0.8rem;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>{ } MOOC Admin</h1>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post">
      <label>Email</label>
      <input type="email" name="email" required autofocus>
      <label>Password</label>
      <input type="password" name="password" required>
      <button type="submit">Log in</button>
    </form>
  </div>
</body>
</html>
